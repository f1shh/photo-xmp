[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "photo-xmp"
version = "0.1.0"
description = "Agent-friendly CLI for editable darktable XMP workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "f1shh" }]
keywords = ["darktable", "xmp", "photography", "cli", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.scripts]
photo-xmp = "photo_xmp.cli:main"

[project.urls]
Homepage = "https://github.com/f1shh/photo-xmp"
Repository = "https://github.com/f1shh/photo-xmp"
Issues = "https://github.com/f1shh/photo-xmp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_xmp"]
artifacts = ["src/photo_xmp/darktable_subject_mask.c"]

[tool.hatch.build.targets.sdist]
include = ["src/photo_xmp", "docs", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
